[project]
name = "fimbench"
version = "0.1.0"
description = "Flood inundation map (FIM) benchmarking utilities: preprocessing the floodmap to a standardized format before uploading to the FIMbench database, S3 database interaction, and querying for FIMbench ."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

authors = [
  { name = "Supath Dhital", email = "sdhital@ua.edu" },
]
maintainers = [
  { name = "Supath Dhital", email = "sdhital@ua.edu" },
]

keywords = ["flood", "FIM", "benchmark", "geospatial", "s3", "geopackage"]

dependencies = [
  "boto3>=1.40",
  "botocore>=1.40",
  "geopandas>=1.1",
  "pandas>=2.2",
  "shapely>=2.0",
  "pyproj>=3.6",
  "rasterio>=1.3",
]

[project.optional-dependencies]
# Vector-tile generation / local serving (needs `tippecanoe` + `mb-util` on PATH).
tiling = [
  "mbutil>=0.3",
]
# Publishing standardized extents to ArcGIS Online.
publish = [
  "arcgis>=2.4",
]
dev = [
  "pytest>=8.0",
  "black>=24.0",
  "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/sdmlua/fimbench"
"FIM Visualizer" = "https://fimbench.streamlit.app/"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
